<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דבר תורה - פלטפורמה מתקדמת</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #6a11cb, #2575fc); color: #333; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #2575fc; }
        .card { background: #f8f9fa; padding: 20px; margin: 15px 0; border-radius: 10px; border-right: 5px solid #6a11cb; }
        .btn { display: block; width: 100%; padding: 15px; background: #2575fc; color: white; text-align: center; border: none; border-radius: 10px; font-size: 1.2em; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #6a11cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 פלטפורמת דבר תורה AI</h1>
        <p style="text-align: center;">מאגר חכם לחיפוש ויצירת דברי תורה</p>
        
        <div class="card">
            <h3>בראשית פרק א' פסוק א'</h3>
            <p>"בראשית ברא אלוהים את השמים ואת הארץ" – הפסוק הפותח את התורה לא בא רק לספר היסטוריה, אלא ללמד אותנו שהעולם לא נברא במקרה. לכל אדם ולכל פרט בבריאה יש תכלית מדויקת.</p>
            <small>נכתב ע"י: דוד | ⭐ דירוג: 15</small>
        </div>

        <button class="btn">✨ הפעל עוזר AI לכתיבה</button>
    </div>
</body>
</html>
